name: release

# Publishes signed Terraform Registry release assets for a vX.Y.Z tag on main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Signed Registry release
    if: github.repository == 'CodeTelemetry/terraform-provider-codetelemetry'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is a stable version of a verified main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Tag must look like v1.2.3"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tagged commit is not on main"; exit 1; }
          # The main candidate pipeline, including the authenticated smoke test, must have passed for this exact commit.
          verified=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/codetelemetry-providers.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success" --jq '.total_count')
          [ "$verified" -ge 1 ] || { echo "No successful main candidate run for $GITHUB_SHA"; exit 1; }
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - name: Build release archives and checksum manifest
        run: python3 scripts/build-artifacts.py
      - name: Sign checksums with the release GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "GPG_PRIVATE_KEY is not configured"; exit 1; }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          sums="dist/terraform-provider-codetelemetry_${RELEASE_VERSION}_SHA256SUMS"
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --detach-sign --output "$sums.sig" "$sums"
          gpgconf --kill gpg-agent
          rm -rf "$GNUPGHOME"
      - name: Verify the signature against the committed public key
        run: |
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import release-signing-key.asc
          sums="dist/terraform-provider-codetelemetry_${RELEASE_VERSION}_SHA256SUMS"
          gpg --batch --verify "$sums.sig" "$sums"
          (cd dist && sha256sum --check --strict "$(basename "$sums")")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
